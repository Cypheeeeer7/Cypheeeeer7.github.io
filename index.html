<style>
html, body { margin: 0; }
/* Layout: left-aligned phone column. A slowly turning cipher disc opens the page, then a big name, then link cards that fill with the accent on press. */
:root {
  --bg: #eceff7;
  --surface: #ffffff;
  --fg: #0f1426;
  --muted: #5a6280;
  --line: #d3d8ea;
  --accent: #d1470a;
  --accent-fg: #ffffff;
  --display: "Syne", "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a0e1a;
    --surface: #121829;
    --fg: #eef0f8;
    --muted: #8d95b5;
    --line: #232b47;
    --accent: #ffb347;
    --accent-fg: #1a1204;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a0e1a;
  --surface: #121829;
  --fg: #eef0f8;
  --muted: #8d95b5;
  --line: #232b47;
  --accent: #ffb347;
  --accent-fg: #1a1204;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--display);
  font-size: 16px;
  line-height: 1.5;
  padding-block: 28px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main { max-width: 440px; margin: 0 auto; display: flex; flex-direction: column; gap: 36px; }

header { display: flex; flex-direction: column; gap: 14px; }
.disc { width: min(78vw, 290px); aspect-ratio: 1; margin-left: -6px; color: var(--fg); }
.disc svg { display: block; width: 100%; height: 100%; }
.disc .ring { fill: none; stroke: var(--line); stroke-width: 1; }
.disc .ring.hot { stroke: var(--accent); stroke-width: 1.5; }
.disc .tick { stroke: var(--muted); stroke-width: 1; }
.disc .out { font-family: var(--mono); font-size: 9.5px; fill: var(--muted); font-weight: 500; }
.disc .inn { font-family: var(--mono); font-size: 10.5px; fill: var(--fg); font-weight: 500; }
.disc .core { font-family: var(--display); font-weight: 800; font-size: 30px; fill: #fff; letter-spacing: -0.04em; paint-order: stroke; stroke: rgba(0,0,0,.45); stroke-width: 3px; }
.spin { transform-origin: 120px 120px; animation: spin 90s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

h1 {
  margin: 0; font-size: clamp(34px, 11.5vw, 52px); line-height: 1.02;
  font-weight: 800; letter-spacing: -0.045em; overflow-wrap: anywhere;
}
.tag { margin: 0; font-family: var(--mono); font-size: 12.5px; color: var(--muted); letter-spacing: 0.03em; }
.tag b { color: var(--accent); font-weight: 500; }

.links { display: flex; flex-direction: column; gap: 12px; padding: 0; margin: 0; list-style: none; }
.row {
  position: relative; display: flex; align-items: center; gap: 14px; min-width: 0;
  background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
  padding: 16px; color: inherit; text-decoration: none; overflow: hidden;
  transition: background .18s, color .18s, border-color .18s, transform .18s;
}
a.row:hover, a.row:focus-visible, a.row:active { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); transform: translateY(-2px); }
a.row:hover .txt span, a.row:focus-visible .txt span, a.row:active .txt span,
a.row:hover .go, a.row:focus-visible .go, a.row:active .go { color: var(--accent-fg); }
a.row:hover .ico, a.row:focus-visible .ico, a.row:active .ico { background: var(--accent-fg); color: var(--accent); }
a.row:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.ico { flex: none; width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: var(--bg); color: var(--accent); transition: background .18s, color .18s; }
.ico svg { width: 22px; height: 22px; fill: currentColor; }
.txt { min-width: 0; flex: 1; display: flex; flex-direction: column; }
.txt strong { font-size: 18px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.2; }
.txt span { font-family: var(--mono); font-size: 12px; color: var(--muted); overflow-wrap: anywhere; transition: color .18s; }
.go { flex: none; color: var(--muted); font-family: var(--mono); font-size: 20px; transition: color .18s; }

.eq { flex: none; display: flex; align-items: flex-end; gap: 3px; height: 20px; }
.eq i { display: block; width: 3px; height: 100%; background: currentColor; border-radius: 1px; transform-origin: bottom; animation: eq 1.1s ease-in-out infinite; }
.eq i:nth-child(2) { animation-delay: -.3s; } .eq i:nth-child(3) { animation-delay: -.6s; } .eq i:nth-child(4) { animation-delay: -.9s; }
@keyframes eq { 0%, 100% { transform: scaleY(.25); } 50% { transform: scaleY(1); } }

.copy {
  flex: none; font-family: var(--mono); font-size: 12px; padding: 9px 13px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--bg); color: var(--fg); cursor: pointer;
}
.copy[data-done="1"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }

footer { font-family: var(--mono); font-size: 11.5px; color: var(--muted); letter-spacing: 0.03em; }
@media (prefers-reduced-motion: reduce) {
  .spin, .eq i { animation: none; }
  .eq i { transform: scaleY(.7); }
  .row, .ico, .txt span, .go { transition: none; }
  a.row:hover { transform: none; }
}
</style>

<script>
(function () {
  /* Cipher disc: fixed outer alphabet, inner alphabet shifted by 7 */
  var NS = "http://www.w3.org/2000/svg", A = "ABCDEFGHIJKLMNOPQRSTUVWXYZ", SHIFT = 7;
  function el(tag, attrs, text) {
    var n = document.createElementNS(NS, tag);
    for (var k in attrs) n.setAttribute(k, attrs[k]);
    if (text) n.textContent = text;
    return n;
  }
  var ticks = document.getElementById("ticks"), outer = document.getElementById("outer"), inner = document.getElementById("inner");
  for (var i = 0; i < 26; i++) {
    var ang = i * 360 / 26;
    var tg = el("line", { "class": "tick", x1: 120, y1: 3, x2: 120, y2: i % 13 === 0 ? 14 : 9, transform: "rotate(" + ang + " 120 120)" });
    ticks.appendChild(tg);
    outer.appendChild(el("text", { "class": "out", x: 120, y: 33, "text-anchor": "middle", transform: "rotate(" + ang + " 120 120)" }, A[i]));
    inner.appendChild(el("text", { "class": "inn", x: 120, y: 58, "text-anchor": "middle", transform: "rotate(" + ang + " 120 120)" }, A[(i + SHIFT) % 26]));
  }

  /* Name decodes once on load; the real text is already in the page */
  var h = document.getElementById("name"), real = "Cypheeeeer7";
  var still = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (!still) {
    var pool = "abcdefghijklmnopqrstuvwxyz0123456789#%&", t0 = null, DUR = 900;
    function frame(t) {
      if (t0 === null) t0 = t;
      var p = Math.min(1, (t - t0) / DUR), keep = Math.floor(p * real.length), out = "";
      for (var j = 0; j < real.length; j++) out += j < keep ? real[j] : pool[Math.floor(Math.random() * pool.length)];
      h.textContent = p >= 1 ? real : out;
      if (p < 1) requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  /* Copy Discord username */
  var btn = document.getElementById("copy-dc"), name = document.getElementById("dc-name");
  btn.addEventListener("click", function () {
    var done = function () {
      btn.textContent = "Copied"; btn.setAttribute("data-done", "1");
      setTimeout(function () { btn.textContent = "Copy"; btn.removeAttribute("data-done"); }, 1600);
    };
    var fallback = function () {
      try { var r = document.createRange(); r.selectNodeContents(name); var s = window.getSelection(); s.removeAllRanges(); s.addRange(r); } catch (e) {}
    };
    try { navigator.clipboard.writeText("userxv2").then(done, fallback); } catch (e) { fallback(); }
  });
})();
</script>
